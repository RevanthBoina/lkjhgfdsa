# Default model selection logic based on device RAM
defaults:
  ram_4gb: "gemma3-1b-q4"
  ram_6gb: "llama3.2-3b-q4"
  ram_8gb: "phi4-mini-3.8b-q4"
  ram_8gb_coding: "qwen2.5-coder-7b-q4"
  ram_8gb_balanced: "gemma3-4b-q4"

# Download settings
download:
  storage_dir: "filesDir/models"
  temp_dir: "cache/models_tmp"
  requires_wifi: true
  requires_charging_for_7b: true
  min_free_space_multiplier: 2.0
  use_workmanager: true
  resumable: true
  verify_sha256: true
  notification_channel: "aniob_model_download"

# Per-role generation parameters (PROMPT A). Consumed by AniobDecodeConfig via
# AniobConfigLoader (assets) with compiled defaults when absent.
generation:
  planner:
    temperature: 0.0
    max_tokens: 512
    json_mode: true
  executor:
    temperature: 0.0
    max_tokens: 128
    json_mode: true
  reflector:
    temperature: 0.2
    max_tokens: 256
    json_mode: true
  grill:
    temperature: 0.3
    max_tokens: 512
    json_mode: true
  explorer:
    temperature: 0.4
    max_tokens: 256
    json_mode: true
