# Default model selection mapping across supported RAM tiers
defaults:
  ram_4gb: "qwen2.5-1.5b-q8"
  ram_6gb: "gemma4-e2b"
  ram_8gb: "phi4-mini-q8"
  ram_8gb_coding: "qwen2.5-1.5b-q8"
  ram_8gb_balanced: "gemma4-e4b"

# Download settings
download:
  storage_dir: "filesDir/models"
  temp_dir: "cache/models_tmp"
  requires_wifi: true
  requires_charging_for_7b: true
  min_free_space_multiplier: 2.0
  use_workmanager: true
  resumable: true
  verify_sha256: true
  notification_channel: "aniob_model_download"

# Per-role generation parameters (PROMPT A). Consumed by AniobDecodeConfig via
# AniobConfigLoader (assets) with compiled defaults when absent.
generation:
  planner:
    temperature: 0.0
    max_tokens: 512
    json_mode: true
  executor:
    temperature: 0.0
    max_tokens: 128
    json_mode: true
  reflector:
    temperature: 0.2
    max_tokens: 256
    json_mode: true
  grill:
    temperature: 0.3
    max_tokens: 512
    json_mode: true
  explorer:
    temperature: 0.4
