# Aniob Agent Execution Parameters
agent:
  name: "Aniob"
  version: "1.0.0"
  min_sdk: 30
  target_sdk: 35
  max_nodes_per_screen: 60
  max_steps_per_task: 25
  step_timeout_ms: 15000
  screenshot_max_dimension: 1120
  screenshot_jpeg_quality: 80
  watchdog_loop_threshold: 3
  battery_cloud_threshold_pct: 20
  fastpath_enabled: true
  intent_shortcuts_enabled: true
  grill_me_threshold_confidence: 0.75
